# Снимок состояния Noctalia — то, что иначе живёт только в
# ~/.local/state/noctalia/settings.toml и перекрывает config/noctalia/config.toml.
# Снят командой:  noctalia config export   (merged: config-dir *.toml + settings.toml)
#
# install.sh кладёт этот файл на место, только если settings.toml ещё нет
# (состояние живой машины не затирается никогда).
#
# Машинно-зависимое, можно смело удалить на другой машине:
#   [desktop_widgets] / [lockscreen_widgets] — координаты (cx/cy) и имена
#   мониторов (eDP-1, HDMI-A-1) текущего ноутбука;
#   [theme] community_palette — вендорская палитра One Dark Two, требует
#   синхронизации каталога с noctalia.dev (нужна сеть).
#
# Обновить снимок после правок в Noctalia:
#   noctalia config export > ~/dotfiles/config/noctalia/settings.toml

[bar.default]
center = [ "preview" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "widget",
    "status",
    "bar",
    "widget_2",
    "session",
    "battery",
    "clock"
]
font_family = "Hasklug Nerd Font"
font_weight = 400
margin_ends = 0
start = [ "launcher", "wallpaper", "workspaces", "ram", "cpu", "keyboard_layout" ]

[control_center]
sidebar = "full"
sidebar_section = "full"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1420.0
    cy = 160.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        stat = "cpu_usage"
        stat2 = "ram_pct"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "davy1ex/niri-windows",
    "cleboost/hotspot",
    "h-jangra/keyviz",
    "kenn/keybind-cheatsheet",
    "prponkshe/umbriel-displays",
    "teagar/niri-workspace-preview",
    "damian-ds7/battery-threshold",
    "alexander/screen-toolkit",
    "noctalia/translator",
    "gabedunn/voxtype"
]

[shell]
font_family = "FontAwesome"
polkit_agent = true

    [shell.animation]
    speed = 4.0

[theme]
builtin = "Noctalia"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "kcolorscheme", "qt" ]

[wallpaper]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [[wallpaper.favorite]]
    community_palette = "One Dark Two"
    palette_source = "community"
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"
    theme_mode = "auto"

[widget.bar]
type = "prponkshe/umbriel-displays:bar"

[widget.cpu]
visualization = "graph"

[widget.preview]
capsule_fill = "on_surface"
type = "teagar/niri-workspace-preview:preview"

[widget.status]
type = "gabedunn/voxtype:status"

[widget.tray]
capsule = true
capsule_fill = "outline"

[widget.widget]
type = "h-jangra/keyviz:widget"

[widget.widget_2]
type = "alexander/screen-toolkit:widget"

[widget.winlist]
type = "davy1ex/niri-windows:winlist"

[widget.workspaces]
label_source = "name"
show_all_outputs = false
