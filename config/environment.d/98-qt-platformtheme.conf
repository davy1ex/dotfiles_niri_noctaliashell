# Тема Qt-приложений (Dolphin, диалоги xdg-desktop-portal-kde, прочие KF6).
#
# Дублирует niri → environment { QT_QPA_PLATFORMTHEME "kde" }, но нужен для
# systemd-юнитов: портал стартует как сервис и переменные композитора в его
# окружение не попадают. Без этого файла диалоги «открыть/сохранить»
# рисуются дефолтной (светлой) темой, пока в системе тёмная.
#
# Почему kde, а не qt6ct: палитра qt6ct читается один раз при старте
# приложения, а цвета иконок в KF6-приложениях берутся из kdeglobals на лету.
# После смены темы в Noctalia окно оставалось в старой палитре, а иконки
# перерисовывались — тёмные иконки на тёмном фоне. С плагином kde всё
# приходит из одного источника (kdeglobals) и переключается живьём.
QT_QPA_PLATFORMTHEME=kde
